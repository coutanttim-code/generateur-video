<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a12">
<title>Kata Video 10s</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0a12;--bg2:#12121c;--bg3:#1a1a28;
--panel:#16161f;--border:#2a2a3a;
--ink:#e8e6e0;--dim:#8a8896;--faint:#4a4858;
--acc:#e5c15a;--acc2:#e87b35;
--ok:#4a9d6a;--err:#c85a4a;--warn:#d4a017;
--r:6px;--fs:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
--fm:ui-monospace,'SF Mono',Menlo,monospace;
}
html,body{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:var(--fs);background:var(--bg);color:var(--ink);min-height:100vh;padding:1.5rem 1rem 12rem;font-size:15px;line-height:1.55;max-width:800px;margin:0 auto}
header{margin-bottom:1.2rem;text-align:center;padding:1rem 0 1.4rem;position:relative}
header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:140px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.5}
h1{font-size:1.8rem;font-weight:300;margin-bottom:.4rem;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:.85rem;color:var(--dim);font-style:italic}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--bg3);color:var(--ink);border:1px solid var(--border);border-left:3px solid var(--acc);padding:.85rem 1.4rem;border-radius:var(--r);font-size:.85rem;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:1000;opacity:0;transition:transform .35s,opacity .35s;max-width:90vw;text-align:center;display:flex;align-items:center;gap:.6rem;pointer-events:none}
.toast.visible{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{border-left-color:var(--ok)}.toast.error{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}
.banner{background:var(--panel);border:1px solid var(--border);border-left:2px solid var(--acc);padding:1rem 1.15rem;border-radius:var(--r);font-size:.8rem;color:var(--dim);margin-bottom:1.2rem;line-height:1.6}
.banner strong{color:var(--ink)}.banner .hl{color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem}
.panel.ok{box-shadow:inset 3px 0 0 var(--ok)}
textarea{width:100%;padding:.85rem 1rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--ink);font-family:var(--fm);font-size:16px;margin-bottom:.6rem;outline:none;resize:vertical;line-height:1.5}
textarea:focus{border-color:var(--acc)}
.btn{width:100%;padding:.9rem 1.2rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--ink);font-size:.85rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-bottom:.7rem;font-family:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{border-color:var(--acc);background:linear-gradient(135deg,rgba(232,123,53,.2),rgba(229,193,90,.15));color:var(--acc);font-size:1.1rem;padding:1.3rem;letter-spacing:.2em}
.status{font-size:.75rem;padding:.6rem .9rem;border-radius:var(--r);margin-bottom:.5rem;display:flex;align-items:center;gap:.6rem;background:var(--bg2);color:var(--dim);border:1px solid var(--border)}
.status.ok{background:rgba(74,157,106,.08);color:var(--ok);border-color:rgba(74,157,106,.3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex-shrink:0}
.status.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hint{font-size:.72rem;color:var(--dim);margin-top:.5rem;line-height:1.5}
.hint a{color:var(--acc);text-decoration:none}
.label{display:block;font-size:.72rem;color:var(--dim);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.15em;font-weight:600}
.upload-zone{border:2px dashed var(--border);border-radius:var(--r);padding:1.8rem 1rem;text-align:center;cursor:pointer;background:var(--bg2);margin-bottom:1rem;position:relative;display:block;touch-action:manipulation}
.upload-zone input[type=file]{position:absolute;width:1px;height:1px;opacity:0.01;overflow:hidden;pointer-events:none;top:0;left:0}
.upload-zone .icon{font-size:2.2rem;color:var(--acc);opacity:.6;margin-bottom:.5rem;pointer-events:none}
.upload-zone .t1{font-size:.9rem;color:var(--ink);margin-bottom:.3rem;pointer-events:none}
.upload-zone .t2{font-size:.72rem;color:var(--dim);pointer-events:none;line-height:1.4}
.photo-preview{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);background:var(--bg2);max-width:340px;margin:0 auto;aspect-ratio:9/16}
.photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.photo-preview .remove-btn{position:absolute;top:.5rem;right:.5rem;background:rgba(200,90,74,.9);color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.video-result{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:1rem}
.video-result video{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;background:#000}
.video-result .caption{padding:.7rem;font-size:.75rem;color:var(--dim);text-align:center;border-top:1px solid var(--border)}
.progress-bar{width:100%;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-bottom:.7rem;border:1px solid var(--border);display:none}
.progress-bar.visible{display:block}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0%;transition:width .4s;border-radius:3px}
.progress-info{font-size:.75rem;font-family:var(--fm);color:var(--dim);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.debug-panel{position:fixed;bottom:0;left:0;right:0;height:180px;background:#05050a;border-top:2px solid var(--acc);z-index:200;display:flex;flex-direction:column;font-family:var(--fm)}
.debug-panel.collapsed{height:40px}
.debug-header{display:flex;justify-content:space-between;align-items:center;padding:.4rem .7rem;background:linear-gradient(90deg,#0f0f18,#1a1a28);border-bottom:1px solid var(--border);flex-shrink:0}
.debug-tabs{display:flex;gap:.25rem}
.debug-tab{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:.68rem;padding:.35rem .7rem;border-radius:3px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.debug-tab.active{color:var(--acc);border-color:var(--acc);background:rgba(229,193,90,.08)}
.debug-actions{display:flex;gap:.3rem}
.debug-actions button{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:.62rem;padding:.28rem .55rem;border-radius:2px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.debug-body{flex:1;overflow-y:auto;padding:.6rem .8rem 1rem;font-size:.72rem;line-height:1.5;color:#c8c8d0}
.debug-body.hidden{display:none}
.journal-body .j-entry{display:flex;gap:.6rem;padding:.25rem 0;align-items:flex-start;border-bottom:1px dashed rgba(255,255,255,.04)}
.journal-body .j-time{font-family:var(--fm);font-size:.7rem;color:var(--faint);flex-shrink:0;min-width:64px;padding-top:.15rem}
.journal-body .j-msg{color:#d8d8e0;flex:1;word-break:break-word;font-size:.78rem}
.journal-body .j-entry.success .j-msg{color:var(--ok)}
.journal-body .j-entry.warn .j-msg{color:var(--warn)}
.journal-body .j-entry.error .j-msg{color:var(--err)}
.debug-entry{margin-bottom:.3rem;padding:.25rem .4rem;border-left:2px solid transparent;border-radius:2px;word-break:break-word}
.debug-entry.info{border-left-color:var(--faint)}
.debug-entry.success{border-left-color:var(--ok);background:rgba(74,157,106,.04)}
.debug-entry.warn{border-left-color:var(--warn);background:rgba(212,160,23,.04)}
.debug-entry.error{border-left-color:var(--err);background:rgba(200,90,74,.06);color:#f0a0a0}
.debug-entry.api{border-left-color:var(--acc)}
.debug-time{color:var(--faint);margin-right:.5rem;font-size:.65rem}
.debug-cat{color:var(--acc);font-weight:600;margin-right:.4rem;font-size:.65rem}
.debug-msg{color:#d8d8e0}
.hidden{display:none!important}
</style>
</head>
